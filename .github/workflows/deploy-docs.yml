name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Clean state
        working-directory: ./docs
        run: |
          rm -f package-lock.json bun.lockb
          rm -rf node_modules

      - name: Install dependencies
        working-directory: ./docs
        run: bun install

      - name: Build with VitePress
        working-directory: ./docs
        run: bun run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    name: Deploy

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Validate deployment
        if: ${{ steps.deployment.outcome == 'success' }}
        run: |
          page_url="${{ steps.deployment.outputs.page_url }}"
          echo "Checking site: ${page_url}"
          status=$(curl -s -o /dev/null -w "%{http_code}" "${page_url}")
          if [ "${status}" -ne 200 ]; then
            echo "Site not reachable: HTTP ${status}"
            exit 1
          fi
          sitemap_url="${page_url}sitemap.xml"
          status=$(curl -s -o /dev/null -w "%{http_code}" "${sitemap_url}")
          if [ "${status}" -ne 200 ]; then
            echo "Sitemap not found at ${sitemap_url} (HTTP ${status})"
            exit 1
          fi
          echo "Site deployed successfully to ${page_url}"
