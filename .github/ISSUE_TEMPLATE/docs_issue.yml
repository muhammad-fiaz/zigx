name: Documentation Issue
description: Report an issue with the documentation
title: "[Docs]: "
labels: ["documentation"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Help us improve the ZIGX documentation by reporting issues, suggesting improvements, or identifying missing content.

  - type: dropdown
    id: type
    attributes:
      label: Issue Type
      options:
        - Incorrect information
        - Missing documentation
        - Unclear explanation
        - Broken link
        - Typo / Grammar
        - Code example issue
        - Other
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Documentation Page
      description: URL or path to the documentation page with the issue
      placeholder: "https://muhammad-fiaz.github.io/zigx/guide/getting-started"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Issue Description
      description: Describe the documentation issue.
      placeholder: What is wrong or missing...
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Fix
      description: If you have a suggestion for how to fix the issue, please describe it.
      placeholder: How the documentation should be updated...

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other relevant information.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have checked that this issue has not already been reported
          required: true
        - label: I am willing to submit a PR to fix this issue
          required: false
