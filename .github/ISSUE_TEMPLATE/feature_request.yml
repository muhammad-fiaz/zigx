name: Feature Request
description: Suggest a new feature or enhancement for ZIGX
title: "[Feature]: "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please provide as much detail as possible.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: A clear description of what the problem is...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you would like.
      placeholder: A clear description of what you want to happen...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you have considered.
      placeholder: Other approaches you have thought about...

  - type: textarea
    id: api
    attributes:
      label: Proposed API (if applicable)
      description: If this involves API changes, show example usage.
      render: zig
      placeholder: |
        const zigx = @import("zigx");
        
        // Example of how the new feature would be used...

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - Compression
        - Extraction
        - Validation
        - API / Interface
        - Performance
        - Security
        - Documentation
        - Build / Tooling
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Nice to have
        - Would be helpful
        - Important for my use case
        - Critical / Blocking
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or examples.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this feature has not been requested
          required: true
        - label: I am willing to help implement this feature
          required: false
